<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Desktop Pet</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-user-select: none;
      user-select: none;
      cursor: default;
    }
    #c {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: transparent;
      transition: filter 0.6s ease;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <audio id="spin-audio" src="assets/spin.mp3" preload="auto"></audio>
  <script type="module" src="renderer.js"></script>
</body>
</html>
